<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyIA - Gerador de Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 p-6 rounded-2xl shadow-2xl border border-slate-800">
        <div class="text-center mb-6">
            <span class="bg-indigo-950 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-800">Acesso VIP</span>
            <h1 class="text-2xl font-extrabold text-white mt-2">⚡ CopyIA Express</h1>
            <p class="text-slate-400 text-xs mt-1">Crie textos que vendem em poucos segundos.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Código de Acesso:</label>
                <input type="password" id="senhaAcesso" placeholder="Digite seu código" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:border-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Produto ou Serviço:</label>
                <input type="text" id="produto" placeholder="Ex: Sapatos, Bolo caseiro, Curso" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:border-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Diferenciais da Oferta:</label>
                <textarea id="detalhes" rows="3" placeholder="Ex: Entrega grátis, 15% de desconto, garantia" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:border-indigo-500 focus:outline-none"></textarea>
            </div>

            <button onclick="gerarCopy()" id="btnGerar" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-3 rounded-lg transition shadow-lg text-sm">
                🚀 Gerar Textos de Venda
            </button>
